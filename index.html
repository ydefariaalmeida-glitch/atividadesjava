<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>pagina interativa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="btnModo">modo escuro</button>

    <div class="container">

        <h1 id="meuTitulo">LYMN</h1>

        <p id="meuParagrafo">aplicativo de agendamentos de beleza</p>

        <button id="meuBotao">entrar</button>

        <p id="mensagem"></p>

    </div>

    <script>
        const botao = document.getElementById('meuBotao');
        const titulo = document.getElementById('meuTitulo');
        const paragrafo = document.getElementById('meuParagrafo');
        const mensagem = document.getElementById('mensagem');

        const btnModo = document.getElementById('btnModo');

        botao.addEventListener('click', function() {
            titulo.textContent = "LYMN";
            paragrafo.textContent = "aqui vc nao perdera tempo de agendamentos";
            mensagem.textContent = "voltar";
        });

        btnModo.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
        });
    </script>

</body>
</html>
